name: Verify reverse display

on:
  pull_request:
  push:
    # Feature branches receive verification through their pull request.
    branches: [master]
    tags: ['**']
  # Verify a branch before opening a pull request when needed.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gui:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: npm ci --prefix gui
      - run: npm test --prefix gui
      - run: npm run build --prefix gui
      - name: Check isolated beginner desktop app source
        # Bash's -e wrapper stops on a failed test on both matrix platforms.
        # PowerShell otherwise continues to later successful node --check calls.
        shell: bash
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci --prefix desktop --ignore-scripts
          node --test --test-timeout=15000 desktop/test/*.test.mjs
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
          node --check desktop/service-entry.cjs
      - name: Build the beginner desktop view
        working-directory: gui
        run: node node_modules/vite/bin/vite.js build --config vite.desktop.config.ts
      - name: Check synthetic beginner flow and narrow layouts
        if: runner.os == 'Linux'
        env:
          PLAYWRIGHT_BROWSERS_PATH: desktop/.browsers
        run: |
          node desktop/node_modules/playwright/cli.js install --with-deps chromium
          node desktop/test/beginner-ui.mjs
          node desktop/test/remembered-ui.mjs
          node desktop/test/remembered-cookie.mjs
          node desktop/test/remembered-network.mjs chromium revoke
          node desktop/test/remembered-network.mjs chromium expiry
          node desktop/test/remembered-network.mjs chromium active-expiry
          node desktop/test/paired-computers-ui.mjs chromium
          node desktop/test/capture-recovery-ui.mjs
          node desktop/test/usb-ui.mjs
          node desktop/test/clipboard-ui.mjs
          node desktop/test/trackpad-ui.mjs
          node desktop/test/view-ui.mjs
          node desktop/test/shortcuts-ui.mjs
          node desktop/test/link-check-ui.mjs
          node desktop/test/startup-history-ui.mjs
          node desktop/test/window-host-ui.mjs
          node desktop/test/video-preference-ui.mjs chromium
          node desktop/test/host-presentation-ui.mjs chromium
      - name: Check Firefox pairing and generated receiver media
        if: runner.os == 'Linux'
        env:
          PLAYWRIGHT_BROWSERS_PATH: desktop/.browsers
        run: |
          node desktop/node_modules/playwright/cli.js install --with-deps firefox
          sudo apt-get install -y ffmpeg
          node desktop/test/paired-computers-ui.mjs firefox
          node desktop/test/browser-media-ui.mjs firefox webrtc
      - name: Artifact identity and upgrade preflight regressions
        run: node --test tools/*.test.mjs

  browser-media-macos:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PLAYWRIGHT_BROWSERS_PATH: desktop/.browsers
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix gui --ignore-scripts
      - run: npm ci --prefix desktop --ignore-scripts
      - name: Build the host view for generated presentation status checks
        working-directory: gui
        run: node node_modules/vite/bin/vite.js build --config vite.desktop.config.ts
      - name: Install synthetic-media test tools
        run: |
          brew install ffmpeg
          node desktop/node_modules/playwright/cli.js install chromium webkit
      - name: Decode generated media with real browser engines
        # Generated media only: no real capture, permission requests or desktop
        # input. Auto reports whether native RTC or negotiated fallback was used.
        run: |
          node desktop/test/browser-media-ui.mjs chromium webrtc
          node desktop/test/browser-media-ui.mjs chromium webcodecs
          node desktop/test/browser-media-ui.mjs webkit webcodecs
          node desktop/test/browser-media-ui.mjs chromium fallback
          node desktop/test/browser-media-ui.mjs chromium connected-fallback
          node desktop/test/browser-media-ui.mjs chromium native-only
          node desktop/test/browser-media-ui.mjs webkit auto
          node desktop/test/browser-media-ui.mjs chromium adaptive
          node desktop/test/browser-media-ui.mjs chromium codec-update
          node desktop/test/video-preference-ui.mjs webkit
          node desktop/test/typing-view-ui.mjs chromium
          node desktop/test/typing-view-ui.mjs webkit
          node desktop/test/typing-view-ui.mjs chromium geometry
          node desktop/test/typing-view-ui.mjs webkit geometry
          node desktop/test/window-switch-ui.mjs chromium
          node desktop/test/window-switch-ui.mjs webkit
          node desktop/test/window-audio-ui.mjs chromium
          node desktop/test/window-audio-ui.mjs webkit
          node desktop/test/presentation-ui.mjs chromium
          node desktop/test/presentation-ui.mjs webkit
          node desktop/test/host-presentation-ui.mjs chromium
          node desktop/test/host-presentation-ui.mjs webkit
          node desktop/test/remembered-network.mjs webkit revoke
          node desktop/test/remembered-network.mjs webkit expiry
          node desktop/test/remembered-network.mjs webkit active-expiry
          node desktop/test/paired-computers-ui.mjs webkit
      - name: Preserve sanitized synthetic-media results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: synthetic-browser-media
          path: |
            desktop/out/browser-media-*/
            desktop/out/video-preference-ui-*/
            desktop/out/window-switch-*/
            desktop/out/typing-view-*/
            desktop/out/window-audio-*/
            desktop/out/presentation-*/
            desktop/out/host-presentation-*/
            desktop/out/remembered-network-*/
          if-no-files-found: ignore

  native-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: msys2/setup-msys2@v2
        with:
          # MINGW64 is deprecated; libusb is now published for UCRT64.
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-libusb
      - name: Configure clean native test build
        run: meson setup .tmp/ci-native --buildtype=debug -Dcompile_server=false
      - name: Compile and run native tests
        env:
          MSYS2_PATH_TYPE: inherit
        run: |
          meson compile -C .tmp/ci-native
          node tools/check-windows-clipboard-fixture.mjs .tmp/ci-native/app/test_reverse_windows_clipboard.exe
          meson test -C .tmp/ci-native --print-errorlogs
      - name: Verify live native log delivery to the dashboard
        env:
          MSYS2_PATH_TYPE: inherit
          SCRCPY_LOG_PIPE_TEST_BINARY: .tmp/ci-native/app/log-pipe-fixture.exe
          SCRCPY_WINDOWS_RUNTIME_TEST_BINARY: .tmp/ci-native/app/scrcpy.exe
        run: |
          npm ci --prefix gui --ignore-scripts
          DSKCPY_PAUSE_TEST_CC=gcc DSKCPY_REQUIRE_PAUSE_FIXTURE=1 DSKCPY_ENCODER_TEST_CC=gcc DSKCPY_REQUIRE_ENCODER_FIXTURE=1 DSKCPY_POINTER_TEST_CC=gcc DSKCPY_REQUIRE_POINTER_FIXTURE=1 node --test gui/server/telemetry.test.mjs gui/server/windows-runtime-native.test.mjs gui/server/windows-pause.test.mjs gui/server/windows-encoder.test.mjs gui/server/windows-pointer.test.mjs
      - name: Assemble and inspect the unsigned Windows desktop prototype without capture
        env:
          MSYS2_PATH_TYPE: inherit
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          dskcpy_runtime_dir="$(cygpath -w /ucrt64/bin)"
          node desktop/collect-windows-runtime.mjs .tmp/ci-native/app/scrcpy.exe "$dskcpy_runtime_dir" .tmp/ci-desktop-runtime
          bash app/deps/adb_windows.sh
          npm ci --prefix desktop --ignore-scripts
          npm run build --prefix gui
          (cd gui && node node_modules/vite/bin/vite.js build --config vite.desktop.config.ts)
          python tools/collect-windows-notices.py .tmp/ci-desktop-runtime .tmp/ci-native-licenses
          node desktop/stage.mjs .tmp/ci-desktop-runtime/scrcpy.exe .tmp/ci-native-licenses app/deps/work/install/adb-windows
          npm run package:windows --prefix desktop
          node desktop/verify-bundle.mjs desktop/out/win-unpacked/resources
          gcc -O2 desktop/test/fake-host.c -o .tmp/desktop-smoke-fixture.exe
          node desktop/test/run-electron-smoke.mjs desktop/out/win-unpacked/resources .tmp/desktop-smoke-fixture.exe
      - name: Archive the verified Windows portable app
        shell: pwsh
        run: |
          Compress-Archive -Path desktop/out/win-unpacked -DestinationPath .tmp/dskcpy-windows-x64.zip
          Expand-Archive .tmp/dskcpy-windows-x64.zip -DestinationPath .tmp/archive-verification
          node desktop/verify-bundle.mjs .tmp/archive-verification/win-unpacked/resources
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: dskcpy-windows-x64-preview
          path: .tmp/dskcpy-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  native-macos:
    name: ${{ matrix.arch == 'arm64' && 'native-macos' || 'native-macos-intel' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      DSKCPY_MAC_HOST_OUTPUT: release/work/host-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify the native runner architecture
        env:
          DSKCPY_EXPECTED_NODE_ARCH: ${{ matrix.arch }}
        run: node -e 'if (process.platform !== "darwin" || process.arch !== process.env.DSKCPY_EXPECTED_NODE_ARCH) process.exit(1)'
      - name: Install native build dependencies
        run: brew install ffmpeg sdl3 meson ninja pkgconf cmake nasm
      - name: Compile the experimental Mac host and run native tests
        run: |
          meson setup build-macos --buildtype=debug -Dcompile_server=false -Dreverse_macos=true -Dusb=false
          meson compile -C build-macos
          meson test -C build-macos --print-errorlogs
      - name: Verify native capabilities and live dashboard telemetry
        run: |
          npm ci --prefix gui --ignore-scripts
          build-macos/app/scrcpy --help | grep -F 'ScreenCaptureKit/VideoToolbox'
          node --test gui/server/macos-build.test.mjs gui/server/telemetry.test.mjs
      - name: Gate native regressions with address and undefined-behavior sanitizers
        run: |
          meson setup build-macos-sanitized --buildtype=debug -Dcompile_server=false -Dreverse_macos=true -Dusb=false -Db_sanitize=address,undefined
          meson compile -C build-macos-sanitized -j 2
          meson test -C build-macos-sanitized --print-errorlogs

      # Each native architecture verifies both paths; source dependencies/builds remain
      # isolated from the ordinary Homebrew-backed developer test build.
      - name: Cache pinned dependency archives (always checksum before extraction)
        uses: actions/cache@v4
        with:
          path: |
            app/deps/work/sources/*.tar.gz
            app/deps/work/sources/*.tar.xz
            app/deps/work/sources/*.zip
          key: macos-host13-sources-${{ hashFiles('app/deps/*.sh', 'app/deps/_init') }}
      - name: Build and verify the separate unsigned Mac hosting candidate
        run: bash release/build_macos_host.sh "$DSKCPY_MAC_HOST_OUTPUT"
      - name: Check packaged browser/dashboard runtime without starting capture
        run: |
          node release/package_macos_host.mjs --check-notices "$DSKCPY_MAC_HOST_OUTPUT"
          "$DSKCPY_MAC_HOST_OUTPUT/Start-dskcpy-host.command" --check
      - name: Build and smoke-test the unsigned Mac desktop shell without capture
        run: |
          npm ci --prefix desktop
          (cd gui && node node_modules/vite/bin/vite.js build --config vite.desktop.config.ts)
          node desktop/stage.mjs "$DSKCPY_MAC_HOST_OUTPUT/bin/scrcpy" "$DSKCPY_MAC_HOST_OUTPUT/licenses" app/deps/work/install/adb-macos
          npm run package:mac --prefix desktop
          dskcpy_mac_resources="$(node --input-type=module -e 'console.log(`desktop/out/${process.arch === "arm64" ? "mac-arm64" : "mac"}/dskcpy Host.app/Contents/Resources`)')"
          node desktop/verify-bundle.mjs "$dskcpy_mac_resources"
          node desktop/test/run-electron-smoke.mjs "$dskcpy_mac_resources"
      - name: Archive the verified Mac app without signing or installation
        run: |
          dskcpy_mac_app="desktop/out/$(node -p 'process.arch === "arm64" ? "mac-arm64" : "mac"')/dskcpy Host.app"
          mkdir -p .tmp/archive-verification
          ditto -c -k --keepParent "$dskcpy_mac_app" ".tmp/dskcpy-macos-${{ matrix.arch }}.zip"
          ditto -x -k ".tmp/dskcpy-macos-${{ matrix.arch }}.zip" .tmp/archive-verification
          node desktop/verify-bundle.mjs '.tmp/archive-verification/dskcpy Host.app/Contents/Resources'
      - uses: actions/upload-artifact@v7
        with:
          name: dskcpy-macos-${{ matrix.arch }}-preview
          path: .tmp/dskcpy-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14
      - name: Preserve executable permissions in CI artifact
        run: tar -C release/work -czf "$DSKCPY_MAC_HOST_OUTPUT.tar.gz" "host-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7
        with:
          name: unsigned-macos-host-${{ matrix.arch }}-candidate
          path: release/work/host-${{ matrix.arch }}.tar.gz
          retention-days: 7

  android-packaging:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        buildtype: [debug, release]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - name: Install build tools
        run: |
          python -m pip install meson ninja
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build from an empty Meson directory
        run: |
          meson setup .tmp/ci-android --buildtype=${{ matrix.buildtype }} -Dcompile_app=false
          meson compile -C .tmp/ci-android
      - name: Verify both declared outputs and companion signature
        run: |
          test -s .tmp/ci-android/server/scrcpy-server
          test -s .tmp/ci-android/server/reverse-display.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify .tmp/ci-android/server/reverse-display.apk
          cmp server/build/outputs/apk/debug/server-debug.apk .tmp/ci-android/server/reverse-display.apk
          node tools/check-android-upgrade.mjs --apk .tmp/ci-android/server/reverse-display.apk --sdk-tools "$ANDROID_HOME/build-tools/36.0.0" --require-current --output .tmp/ci-android/server/android-identity.json
      - name: Android unit tests
        if: matrix.buildtype == 'debug'
        run: ./gradlew :server:testDebugUnitTest
      - name: Verify reconciled audio tests ran and retain counts only
        if: matrix.buildtype == 'debug'
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path
          reports = sorted(Path('server/build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
          assert reports, 'Android unit reports are missing'
          suites = []
          for report in reports:
              root = ET.parse(report).getroot()
              suites.append({'name': root.attrib['name'], **{key: int(root.attrib.get(key, 0)) for key in ['tests', 'failures', 'errors', 'skipped']}})
          audio = next(s for s in suites if s['name'] == 'com.genymobile.scrcpy.reverse.ReverseAudioPcmBufferTest')
          passed = audio['tests'] >= 8 and audio['skipped'] == 0 and all(s['failures'] == 0 and s['errors'] == 0 for s in suites)
          Path('.tmp/ci-android/android-unit-summary.json').write_text(json.dumps({'passed': passed, 'suites': suites}, indent=2) + '\n')
          assert passed, 'Reconciled audio unit coverage did not pass'
          PY
      - name: Preserve Android unit summary without output or environment data
        if: always() && matrix.buildtype == 'debug'
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-summary
          path: .tmp/ci-android/android-unit-summary.json
          if-no-files-found: ignore
      - name: Build standalone server without Gradle
        if: matrix.buildtype == 'debug'
        run: BUILD_DIR=.tmp/ci-manual bash server/build_without_gradle.sh
      - name: Build the unsigned Android release candidate
        if: matrix.buildtype == 'debug'
        run: |
          ./gradlew :server:assembleRelease
          test -s server/build/outputs/apk/release/server-release-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -p 4 server/build/outputs/apk/release/server-release-unsigned.apk
      - name: Preserve release inputs for local signing with the existing key
        if: matrix.buildtype == 'debug'
        uses: actions/upload-artifact@v7
        with:
          name: dskcpy-android-release-inputs
          path: |
            server/build/outputs/apk/release/server-release-unsigned.apk
            .tmp/ci-manual/scrcpy-server
          if-no-files-found: error
          retention-days: 14
