name: Verify reverse display

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gui:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: npm ci --prefix gui
      - run: npm test --prefix gui
      - run: npm run build --prefix gui
      - name: Check isolated beginner desktop app source
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci --prefix desktop --ignore-scripts
          node --test --test-timeout=15000 desktop/test/*.test.mjs
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
          node --check desktop/service-entry.cjs
      - name: Build the beginner desktop view
        working-directory: gui
        run: node node_modules/vite/bin/vite.js build --config vite.desktop.config.ts
      - name: Check synthetic beginner flow and narrow layouts
        if: runner.os == 'Linux'
        env:
          PLAYWRIGHT_BROWSERS_PATH: desktop/.browsers
        run: |
          node desktop/node_modules/playwright/cli.js install --with-deps chromium
          node desktop/test/beginner-ui.mjs
          node desktop/test/remembered-ui.mjs
      - name: Artifact identity and upgrade preflight regressions
        run: node --test tools/*.test.mjs

  native-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: msys2/setup-msys2@v2
        with:
          # MINGW64 is deprecated; libusb is now published for UCRT64.
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-libusb
      - name: Configure clean native test build
        run: meson setup .tmp/ci-native --buildtype=debug -Dcompile_server=false
      - name: Compile and run native tests
        run: |
          meson compile -C .tmp/ci-native
          meson test -C .tmp/ci-native --print-errorlogs
      - name: Verify live native log delivery to the dashboard
        env:
          MSYS2_PATH_TYPE: inherit
          SCRCPY_LOG_PIPE_TEST_BINARY: .tmp/ci-native/app/log-pipe-fixture.exe
          SCRCPY_WINDOWS_RUNTIME_TEST_BINARY: .tmp/ci-native/app/scrcpy.exe
        run: |
          npm ci --prefix gui --ignore-scripts
          node --test gui/server/telemetry.test.mjs gui/server/windows-runtime-native.test.mjs
      - name: Assemble and inspect the unsigned Windows desktop prototype without capture
        env:
          MSYS2_PATH_TYPE: inherit
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          dskcpy_runtime_dir="$(cygpath -w /ucrt64/bin)"
          node desktop/collect-windows-runtime.mjs .tmp/ci-native/app/scrcpy.exe "$dskcpy_runtime_dir" .tmp/ci-desktop-runtime
          npm ci --prefix desktop --ignore-scripts
          npm run build --prefix gui
          (cd gui && node node_modules/vite/bin/vite.js build --config vite.desktop.config.ts)
          node desktop/stage.mjs .tmp/ci-desktop-runtime/scrcpy.exe
          npm run package:windows --prefix desktop
          node desktop/verify-bundle.mjs desktop/out/win-unpacked/resources
          gcc -O2 desktop/test/fake-host.c -o .tmp/desktop-smoke-fixture.exe
          node desktop/test/run-electron-smoke.mjs desktop/out/win-unpacked/resources .tmp/desktop-smoke-fixture.exe

  native-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install native build dependencies
        run: brew install ffmpeg sdl3 meson ninja pkgconf cmake nasm
      - name: Compile the experimental Mac host and run native tests
        run: |
          meson setup build-macos --buildtype=debug -Dcompile_server=false -Dreverse_macos=true -Dusb=false
          meson compile -C build-macos
          meson test -C build-macos --print-errorlogs
      - name: Verify native capabilities and live dashboard telemetry
        run: |
          npm ci --prefix gui --ignore-scripts
          build-macos/app/scrcpy --help | grep -F 'ScreenCaptureKit/VideoToolbox'
          node --test gui/server/macos-build.test.mjs gui/server/telemetry.test.mjs
      - name: Gate native regressions with address and undefined-behavior sanitizers
        run: |
          meson setup build-macos-sanitized --buildtype=debug -Dcompile_server=false -Dreverse_macos=true -Dusb=false -Db_sanitize=address,undefined
          meson compile -C build-macos-sanitized -j 2
          meson test -C build-macos-sanitized --print-errorlogs

      # One Mac runner verifies both paths; source dependencies/builds remain
      # isolated from the ordinary Homebrew-backed developer test build.
      - name: Cache pinned dependency archives (always checksum before extraction)
        uses: actions/cache@v4
        with:
          path: |
            app/deps/work/sources/*.tar.gz
            app/deps/work/sources/*.tar.xz
            app/deps/work/sources/*.zip
          key: macos-host13-sources-${{ hashFiles('app/deps/*.sh', 'app/deps/_init') }}
      - name: Build and verify the separate unsigned Mac hosting candidate
        run: bash release/build_macos_host.sh release/work/host-arm64
      - name: Check packaged browser/dashboard runtime without starting capture
        run: release/work/host-arm64/Start-dskcpy-host.command --check
      - name: Build and smoke-test the unsigned Mac desktop shell without capture
        run: |
          npm ci --prefix desktop
          (cd gui && node node_modules/vite/bin/vite.js build --config vite.desktop.config.ts)
          node desktop/stage.mjs release/work/host-arm64/bin/scrcpy release/work/host-arm64/licenses
          npm run package:mac --prefix desktop
          node desktop/verify-bundle.mjs "desktop/out/mac-arm64/dskcpy Host.app/Contents/Resources"
          node desktop/test/run-electron-smoke.mjs
      - name: Preserve executable permissions in CI artifact
        run: tar -C release/work -czf release/work/host-arm64.tar.gz host-arm64
      - uses: actions/upload-artifact@v7
        with:
          name: unsigned-macos-host-arm64-candidate
          path: release/work/host-arm64.tar.gz
          retention-days: 7

  android-packaging:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        buildtype: [debug, release]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - name: Install build tools
        run: |
          python -m pip install meson ninja
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build from an empty Meson directory
        run: |
          meson setup .tmp/ci-android --buildtype=${{ matrix.buildtype }} -Dcompile_app=false
          meson compile -C .tmp/ci-android
      - name: Verify both declared outputs and companion signature
        run: |
          test -s .tmp/ci-android/server/scrcpy-server
          test -s .tmp/ci-android/server/reverse-display.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify .tmp/ci-android/server/reverse-display.apk
          cmp server/build/outputs/apk/debug/server-debug.apk .tmp/ci-android/server/reverse-display.apk
          node tools/check-android-upgrade.mjs --apk .tmp/ci-android/server/reverse-display.apk --sdk-tools "$ANDROID_HOME/build-tools/36.0.0" --require-current --output .tmp/ci-android/server/android-identity.json
      - name: Android unit tests
        if: matrix.buildtype == 'debug'
        run: ./gradlew :server:testDebugUnitTest
      - name: Build standalone server without Gradle
        if: matrix.buildtype == 'debug'
        run: BUILD_DIR=.tmp/ci-manual bash server/build_without_gradle.sh
