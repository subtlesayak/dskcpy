apply plugin: 'com.android.application'

def identity = new Properties()
rootProject.file('dskcpy.properties').withInputStream { identity.load(it) }
def artifactVersion = identity.getProperty('DSKCPY_VERSION')
def protocolVersion = identity.getProperty('SCRCPY_PROTOCOL_VERSION')
def artifactCode = identity.getProperty('DSKCPY_ANDROID_VERSION_CODE').toInteger()
if (!(artifactVersion ==~ /[0-9A-Za-z.+-]+/) || !(protocolVersion ==~ /[0-9.]+/)
        || artifactCode <= 50001 || artifactCode > 2100000000 || identity.getProperty('REVERSE_PROTOCOL_VERSION') != '1') {
    throw new GradleException('Invalid dskcpy identity or non-monotonic Android version code')
}

android {
    namespace = 'com.genymobile.scrcpy'
    compileSdk = 36
    defaultConfig {
        applicationId = "com.genymobile.scrcpy"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode artifactCode
        versionName artifactVersion
        buildConfigField 'String', 'SCRCPY_PROTOCOL_VERSION', '"' + protocolVersion + '"'
        testInstrumentationRunner = "android.support.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    buildFeatures {
        buildConfig = true
        aidl = true
    }
    sourceSets.test.resources.srcDir 'src/main/assets'
    lint {
        disable 'UseRequiresApi'
    }
}

dependencies {
    // Material 3 Views integrate with the existing Java/SurfaceView receiver,
    // without moving video rendering onto a different UI toolkit.
    implementation 'com.google.android.material:material:1.12.0'
    testImplementation 'junit:junit:4.13.2'
}

apply from: "$project.rootDir/config/android-checkstyle.gradle"
